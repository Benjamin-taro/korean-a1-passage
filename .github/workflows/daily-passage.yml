name: Daily Korean A1 passage (Claude Code)

on:
  schedule:
    # ロンドン時間の毎日 01:00。夏時間（BST, 00:00 UTC）と冬時間（GMT, 01:00 UTC）の 2 本を置き、
    # scripts/tz_gate.sh でロンドン時間 01 時にあたるほうだけを実行する
    - cron: "23 0 * * *"
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYY-MM-DD（空欄なら今日のロンドン日付）"
        required: false
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: ${{ github.repository }}-daily-passage
  cancel-in-progress: false

env:
  TZ: Europe/London

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: TZ gate
        id: gate
        run: scripts/tz_gate.sh "${{ github.event.schedule }}" 1

      - name: Decide date
        id: date
        if: steps.gate.outputs.run == 'true'
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          d="${INPUT_DATE:-}"
          if [ -z "$d" ]; then d=$(date +%F); fi
          if ! [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "invalid date: $d" >&2; exit 1; fi
          echo "date=$d" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate passage
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          claude -p "今日は ${DATE} です。.claude/skills/korean-a1-passage/SKILL.md を読み、その手順に厳密に従って ${DATE} の passage を作成してください。git は実行しないでください。終わったら作成したファイルとタイトルを短く報告してください。" \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" \
            --disallowedTools "Bash" \
            --permission-mode dontAsk

      - name: Commit and push
        id: commit
        if: steps.gate.outputs.run == 'true'
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          # history.json は新しい順に並んでいるので、末尾ではなく対象日のエントリからタイトルを取る
          title=$(jq -r --arg d "$DATE" '[.entries[] | select(.date == $d) | .title][0] // empty' history.json 2>/dev/null || true)
          if [ -n "$title" ]; then msg="passage: ${DATE} — ${title}"; else msg="passage: ${DATE}"; fi
          git commit -m "$msg"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && echo "pushed=1" >> "$GITHUB_OUTPUT" && exit 0
            sleep 5
          done
          exit 1

      # Pages はブランチ（main /）からのビルド（legacy）。GITHUB_TOKEN での push でもビルドは走るはずだが、念のため明示的に要求する
      - name: Request Pages build
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || echo "pages build request failed (ignored)"
