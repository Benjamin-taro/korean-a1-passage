name: Daily Korean A1 passage (Claude Code)

on:
  schedule:
    # GitHub の定期実行は数時間遅れたり飛ばされたりするので、1 回に頼らず毎時確認する。
    # UTC 0:23〜9:23 の毎時に動き、今日（ロンドン時間）の passage がまだなければ作る。作成済みなら確認だけで終わる
    - cron: "23 0-9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYY-MM-DD（空欄なら今日のロンドン日付）"
        required: false
        default: ""
      check:
        description: "認証の確認だけ行う（passage は作らない）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write

concurrency:
  group: ${{ github.repository }}-daily-passage
  cancel-in-progress: false

env:
  TZ: Europe/London

jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check auth only
        if: inputs.check == true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude -p "動作確認です。「OK」とだけ返してください。" --allowedTools "Read"
      - name: Skip if already generated
        id: gate
        run: |
          # 定期実行、または日付指定なしの外部起動（cron-job.org）では、今日の分が作成済みならスキップ
          if [ "${{ inputs.check }}" = "true" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "${{ inputs.date }}" ] && [ -f "passages/$(date +%F)/$(date +%F).md" ]; then
            echo "passages/$(date +%F) は作成済み"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide date
        id: date
        if: steps.gate.outputs.run == 'true'
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          d="${INPUT_DATE:-}"
          if [ -z "$d" ]; then d=$(date +%F); fi
          if ! [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "invalid date: $d" >&2; exit 1; fi
          echo "date=$d" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate passage
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          claude -p "今日は ${DATE} です。.claude/skills/korean-a1-passage/SKILL.md を読み、その手順に厳密に従って ${DATE} の passage を作成してください。git は実行しないでください。終わったら作成したファイルとタイトルを短く報告してください。" \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" \
            --disallowedTools "Bash" \
            --permission-mode dontAsk

      - name: Commit and push
        id: commit
        if: steps.gate.outputs.run == 'true'
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          # history.json は新しい順に並んでいるので、末尾ではなく対象日のエントリからタイトルを取る
          title=$(jq -r --arg d "$DATE" '[.entries[] | select(.date == $d) | .title][0] // empty' history.json 2>/dev/null || true)
          if [ -n "$title" ]; then msg="passage: ${DATE} — ${title}"; else msg="passage: ${DATE}"; fi
          git commit -m "$msg"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && echo "pushed=1" >> "$GITHUB_OUTPUT" && exit 0
            sleep 5
          done
          exit 1

      # Pages はブランチ（main /）からのビルド（legacy）。GITHUB_TOKEN での push でもビルドは走るはずだが、念のため明示的に要求する
      - name: Request Pages build
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || echo "pages build request failed (ignored)"
